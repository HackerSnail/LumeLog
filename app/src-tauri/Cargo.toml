[package]
name = "lumelog-app"
version = "0.1.0"
description = "LumeLog desktop shell (Tauri v2) — thin IPC layer over lumelog-core"
edition = "2021"
rust-version = "1.79"

[lib]
name = "lumelog_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumelog-core = { path = "../../crates/lumelog-core" }
lumelog-can = { path = "../../crates/lumelog-can" }

[dev-dependencies]
tempfile = "3"
