[package]
name = "lumelog-app"
version = "0.1.0"
description = "LumeLog desktop shell (Tauri v2) — thin IPC layer over lumelog-core"
edition = "2021"
rust-version = "1.89"

[lib]
name = "lumelog_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"
rquickjs = "0.14"
# MF4 reader (Roadmap-4): mmap only, no rayon/arrow/parquet surface.
falcon_mdf = { version = "0.7", default-features = false, features = ["mmap"] }
lumelog-core = { path = "../../crates/lumelog-core" }
lumelog-can = { path = "../../crates/lumelog-can" }
calamine = { version = "0.37.0", features = ["chrono"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.12.1"
wasmi = "2.0.0"

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
tempfile = "3"
wasm-encoder = "0.262.0"
