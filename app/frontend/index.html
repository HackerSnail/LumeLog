<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumeLog</title>
    <script>
      // Paint the stored theme before first render so a dark / Dracula
      // preference never flashes light. Mirrors theme.ts's resolveTheme; the
      // module re-applies (and keeps it live on `matchMedia` change) after.
      (function () {
        try {
          var pref = localStorage.getItem("lumelog.theme") || "auto";
          var dark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var t = pref === "auto" ? (dark ? "dark" : "light") : pref;
          if (t !== "light" && t !== "dark" && t !== "vampire") t = "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
