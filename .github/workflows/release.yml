name: Release

# Tag-triggered three-platform Tauri bundle build. The upload-to-Gitee step is
# publish-gated: it only runs for a `workflow_dispatch` with `publish: true` and
# repo secrets configured, so a stray tag can never push to the shared releases
# page by itself (a publish is an outward side effect and needs a human decision).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to Gitee releases (requires GITEE_TOKEN secret)"
        type: boolean
        default: false
      tag:
        description: "Version tag to create/attach on Gitee (e.g. v0.1.0); required when publish=true"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build bundle (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - runs-on: macos-latest
            target: x86_64-apple-darwin
          - runs-on: macos-latest
            target: aarch64-apple-darwin
          - runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps for Tauri
        if: matrix.platform.runs-on == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend deps
        working-directory: app/frontend
        run: npm ci

      # Builds NSIS/MSI (Windows), DMG (macOS), deb/AppImage (Linux) per
      # tauri.conf.json bundle.targets. `npm run tauri build` runs
      # beforeBuildCommand (tsc --noEmit + vite) first.
      - name: Tauri build
        working-directory: app/frontend
        run: npx tauri build --target ${{ matrix.platform.target }}

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumelog-${{ matrix.platform.target }}
          # The Tauri step runs from app/frontend, but src-tauri is a member of
          # the repo-root workspace (no .cargo target-dir override), so cargo
          # writes bundles to the repo-root target/<triple>/release/bundle.
          path: |
            target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  publish-gitee:
    name: Publish to Gitee releases
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Gitee release API: create a release on the repo, then attach each
      # installer. Owner/repo come from vars so the file stays generic.
      # Requires secrets.GITEE_TOKEN (private-token with repo scope).
      - name: Create release + upload assets
        env:
          OWNER: ${{ vars.GITEE_OWNER }}
          REPO: ${{ vars.GITEE_REPO }}
          # workflow_dispatch runs on a branch, so github.ref_name is the branch
          # name, not a version tag. The tag to publish must be supplied explicitly.
          TAG: ${{ github.event.inputs.tag }}
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -eu
          test -n "$TAG" || { echo "publish needs a version tag input (e.g. v0.1.0)" >&2; exit 1; }
          test -n "$TOKEN" || { echo "GITEE_TOKEN secret not set; aborting publish" >&2; exit 1; }
          curl -sf -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases" \
            -d "access_token=${TOKEN}" \
            -d "tag_name=${TAG}" \
            -d "name=LumeLog ${TAG}" \
            -d "body=M1 editor-core release: streaming large-file open, GBK/GB18030/UTF-16 encodings, literal/regex search."
          # A failed asset upload must fail the job, not print-and-pass. Process
          # substitution (not `find | while`) keeps the loop in the current shell
          # so the `fail` flag survives to the final gate (final-review N-7).
          fail=0
          while IFS= read -r -d '' f; do
            curl -sf -X POST "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${TAG}/assets" \
              -F "access_token=${TOKEN}" \
              -F "file=@${f}" || { echo "asset upload failed: ${f}" >&2; fail=1; }
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test "$fail" -eq 0 || { echo "one or more Gitee asset uploads failed" >&2; exit 1; }
