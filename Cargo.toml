[workspace]
resolver = "2"
members = ["crates/lumelog-core", "crates/lumelog-can", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"

[workspace.dependencies]
memchr = "2"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
